<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyGPT Chat</title>
  <style>
    :root {
      --bg: #f3efe6;
      --panel: rgba(255, 252, 246, 0.9);
      --ink: #1f1a17;
      --muted: #6b625a;
      --accent: #b85c38;
      --accent-2: #2f6f6d;
      --line: rgba(31, 26, 23, 0.12);
      --shadow: 0 24px 60px rgba(64, 37, 24, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(184, 92, 56, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(47, 111, 109, 0.14), transparent 28%),
        linear-gradient(135deg, #efe5d2 0%, var(--bg) 48%, #e8dcc8 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(920px, 100%);
      height: min(88vh, 820px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .header {
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
      font-weight: 700;
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .chat {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 80%;
      padding: 14px 16px;
      border-radius: 18px;
      white-space: pre-wrap;
      line-height: 1.5;
      border: 1px solid var(--line);
      animation: rise 180ms ease-out;
    }

    .msg.user {
      align-self: flex-end;
      background: #f7d9c7;
      border-bottom-right-radius: 6px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #edf4f2;
      border-bottom-left-radius: 6px;
    }

    .msg.meta {
      align-self: center;
      background: rgba(255,255,255,0.65);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 18px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.55);
    }

    textarea {
      width: 100%;
      min-height: 60px;
      max-height: 180px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      outline: none;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 0 20px;
      min-width: 120px;
      font: inherit;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--accent), #cb7a58);
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .shell { height: 92vh; border-radius: 20px; }
      .chat { padding: 16px; }
      .msg { max-width: 90%; }
      form { grid-template-columns: 1fr; }
      button { min-height: 52px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="eyebrow">Local Model</div>
      <h1>TinyGPT Chat</h1>
      <div class="sub">This page uses the same prompt format and model call as your terminal chat command.</div>
    </header>

    <section id="chat" class="chat">
      <div class="msg meta">Model loaded. Type a message below to chat.</div>
    </section>

    <form id="form">
      <textarea id="message" placeholder="Write your message here..." required></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(kind, text) {
      const el = document.createElement("div");
      el.className = "msg " + kind;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) {
        return;
      }

      addMessage("user", message);
      input.value = "";
      input.focus();
      send.disabled = true;
      const pending = addMessage("meta", "TinyGPT is thinking...");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        pending.remove();

        if (!response.ok) {
          addMessage("meta", data.error || "Request failed.");
          return;
        }

        addMessage("bot", data.reply);
      } catch (error) {
        pending.remove();
        addMessage("meta", "Could not reach the local TinyGPT server.");
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
